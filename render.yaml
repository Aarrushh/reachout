services:
  - type: web
    name: reachout-api
    runtime: python
    plan: free
    rootDir: reachout
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_CHAT_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
